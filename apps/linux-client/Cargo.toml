[package]
name = "cyberia-linux-client"
version = "0.1.0"
description = "Managed Linux client executable for Cyberia VPN"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cyberia-killswitch = { path = "../../core/killswitch" }
cyberia-transport = { path = "../../core/transport" }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
